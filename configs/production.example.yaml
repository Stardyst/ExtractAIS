input:
  raw_root: "E:/AIS2021-2022"
  year_directories:
    2021: "2021"
    2022: "2022"
  filename_pattern: "*.csv"
  ports_csv: "E:/AIS2021-2022/UpdatedPub150.csv"

storage:
  # F and G are separate physical HDDs. Partition N is permanently assigned
  # to track_roots[N % 2], so each disk performs one sequential heavy query.
  track_roots:
    - "F:/ExtractAIS-v2"
    - "G:/ExtractAIS-v2"
  # D is NVMe and contains DuckDB spill, heartbeats, and active track-phase files.
  temp_root: "D:/ExtractAIS-v2-temp"
  # H stores compact retained products. H-I are one physical disk, so H is not
  # counted as an additional concurrent compute lane.
  products_root: "H:/ExtractAIS-v2/products"
  # E and I are on different physical disks during geometry-heavy stages.
  evidence_roots:
    - "E:/AIS2021-2022/ExtractAIS-v2-evidence"
    - "I:/ExtractAIS-v2/evidence"
  reserves_gib:
    tracks: 1024
    temp: 200
    products: 300
    evidence: 500

runtime:
  global_threads: 16
  global_memory: "90GB"
  workers_per_track_root: 1
  worker_threads: 6
  worker_memory: "40GB"
  worker_temp_gib: 180
  progress_interval_seconds: 5
  enable_progress: true

layout:
  # Fixed before the first full run. A power of two is required.
  track_partitions: 1024
  row_group_size: 50000
  compression: "zstd"

cleaning:
  dynamic_message_types: [1, 2, 3, 18, 19, 27]
  static_message_types: [5, 24]
  max_implied_speed_knots: 80

stops:
  max_speed_knots: 0.5
  max_step_km: 0.25
  max_point_gap_minutes: 60
  min_duration_minutes: 60
  max_diameter_km: 1.0

ports:
  entry_radius_km: 3
  exit_radius_km: 4
  approach_radius_km: 10
  group_distance_km: 4
  anchor_assignment_radius_km: 20
  anchor_grid_degrees: 0.005
  anchor_min_stop_events: 3
  anchor_min_vessels: 3
  call_min_points: 2
  call_max_point_gap_hours: 6
  ambiguity_margin_km: 1
  excluded_harbor_sizes: []

intervals:
  unknown_gap_hours: 6
