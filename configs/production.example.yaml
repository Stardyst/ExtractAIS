input:
  raw_root: "E:/AIS2021-2022"
  year_directories:
    2021: "2021"
    2022: "2022"
  filename_pattern: "*.csv"
  ports_csv: "E:/AIS2021-2022/UpdatedPub150.csv"

storage:
  work_root: "E:/AIS2021-2022/derived"
  temp_directory: "E:/AIS2021-2022/derived/tmp"

runtime:
  threads: 20
  memory_limit: "90GB"
  # One worker avoids random I/O on the production HDD. Prepare permanently
  # subdivides large full-archive buckets before running window queries.
  bucket_workers: 1
  bucket_threads: 8
  bucket_memory_limit: "80GB"
  bucket_temp_limit_gb: 256
  enable_progress: true
  # Preserve this much free space after the next estimated work-unit output.
  # The guard applies to every stage and also caps DuckDB temporary spill files.
  minimum_free_space_gb: 500

split:
  dynamic_message_types: [1, 2, 3, 18, 19, 27]
  static_message_types: [5, 24]
  compression: "zstd"
  row_group_size: 1000000

prepare:
  # 256 buckets keep monthly partitions above roughly 100 MiB. Stage 03 then
  # hash-shards each full-archive bucket into bounded permanent work units.
  # Do not change this after prepare has started.
  mmsi_buckets: 256
  # Keep one writer open per bucket. A lower value repeatedly closes writers
  # and creates thousands of small Parquet files on production-scale months.
  partition_write_max_open_files: 256
  compression: "zstd"
  row_group_size: 250000
  max_implied_speed_knots: 80

stops:
  max_speed_knots: 0.5
  max_step_km: 0.25
  max_point_gap_minutes: 60
  min_duration_minutes: 60
  max_diameter_km: 1.0

ports:
  entry_radius_km: 3
  exit_radius_km: 4
  approach_radius_km: 10
  group_distance_km: 4
  anchor_assignment_radius_km: 20
  anchor_grid_degrees: 0.005
  anchor_min_stop_events: 3
  anchor_min_vessels: 3
  call_min_points: 2
  call_max_point_gap_hours: 6
  ambiguity_margin_km: 1
  # Set to ["Very Small"] only after reviewing outputs/validation.
  excluded_harbor_sizes: []

intervals:
  unknown_gap_hours: 6
