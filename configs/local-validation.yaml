input:
  raw_root: "../sample-input"
  year_directories:
    2021: "2021"
    2022: "2022"
  filename_pattern: "*.csv"
  ports_csv: "../UpdatedPub150.csv"
storage:
  track_roots: ["../work/track-a", "../work/track-b"]
  temp_root: "../work/temp"
  products_root: "../work/products"
  evidence_roots: ["../work/evidence-a", "../work/evidence-b"]
  reserves_gib: {tracks: 0, temp: 0, products: 0, evidence: 0}
runtime:
  global_threads: 4
  global_memory: "4GB"
  workers_per_track_root: 1
  worker_threads: 2
  worker_memory: "1536MB"
  worker_temp_gib: 1
  progress_interval_seconds: 1
  enable_progress: true
layout:
  track_partitions: 8
  row_group_size: 10000
  compression: "zstd"
cleaning:
  dynamic_message_types: [1, 2, 3, 18, 19, 27]
  static_message_types: [5, 24]
  max_implied_speed_knots: 80
stops:
  max_speed_knots: 0.5
  max_step_km: 0.25
  max_point_gap_minutes: 60
  min_duration_minutes: 60
  max_diameter_km: 1.0
ports:
  entry_radius_km: 3
  exit_radius_km: 4
  approach_radius_km: 10
  group_distance_km: 4
  anchor_assignment_radius_km: 20
  anchor_grid_degrees: 0.005
  anchor_min_stop_events: 1
  anchor_min_vessels: 1
  call_min_points: 2
  call_max_point_gap_hours: 6
  ambiguity_margin_km: 1
  excluded_harbor_sizes: []
intervals:
  unknown_gap_hours: 6
