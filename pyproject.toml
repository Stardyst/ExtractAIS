[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extractais"
version = "1.0.1"
description = "Auditable preprocessing of large AIS archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.4,<1.5",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
extractais = "extractais.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
